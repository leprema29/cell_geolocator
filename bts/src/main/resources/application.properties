spring.application.name=bts
server.port=8081
server.address=0.0.0.0

spring.profiles.active=dev

# H2 embedded database (file-based, persistent)
spring.datasource.url=jdbc:h2:file:./data/bts-users;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.access.token.expiry-ms=3600000
jwt.refresh.token.expiry-ms=2592000000

# BTS data files (configurable paths)
bts.data.orange.path=/home/data/dataforservice/orangebts.properties
bts.data.mtn.path=/home/data/dataforservice/mtnbts.properties

# Provider priority
providers.priority=LOCAL_DB,OpenCellID,UnwiredLabs,Combain

# Rate limiter (global)
ratelimit.capacity=60
ratelimit.refill-per-minute=60

# Springdoc
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.config.import=optional:file:.env[.properties]
